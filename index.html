<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Notes App</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
        }
        .note-item:hover {
            background-color: #f3f4f6;
        }
        .note-item.active {
            background-color: #e0e7ff;
            border-left: 4px solid #4f46e5;
        }
        .empty-state {
            opacity: 0.6;
        }
    </style>
</head>
<body class="bg-gray-50 h-screen overflow-hidden">
    <div class="flex h-full">
        <!-- Sidebar -->
        <div class="w-80 bg-white border-r border-gray-200 flex flex-col">
            <!-- Header -->
            <div class="p-4 border-b border-gray-200">
                <h1 class="text-2xl font-bold text-gray-800 mb-4">Notes</h1>
                <button id="newNoteBtn" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-medium py-2 px-4 rounded-lg transition-colors duration-200">
                    + New Note
                </button>
            </div>
            
            <!-- Search -->
            <div class="p-4 border-b border-gray-200">
                <input 
                    type="text" 
                    id="searchInput" 
                    placeholder="Search notes..." 
                    class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500"
                >
            </div>
            
            <!-- Notes List -->
            <div id="notesList" class="flex-1 overflow-y-auto">
                <!-- Notes will be dynamically added here -->
            </div>
        </div>
        
        <!-- Main Content Area -->
        <div class="flex-1 flex flex-col">
            <!-- Editor Header -->
            <div class="bg-white border-b border-gray-200 p-4 flex justify-between items-center">
                <div class="flex-1">
                    <input 
                        type="text" 
                        id="noteTitle" 
                        placeholder="Note Title" 
                        class="text-2xl font-semibold text-gray-800 w-full focus:outline-none"
                        disabled
                    >
                </div>
                <div class="flex gap-2">
                    <button id="deleteBtn" class="px-4 py-2 text-red-600 hover:bg-red-50 rounded-lg transition-colors duration-200 hidden">
                        Delete
                    </button>
                    <button id="saveBtn" class="px-4 py-2 bg-indigo-600 hover:bg-indigo-700 text-white rounded-lg transition-colors duration-200 hidden">
                        Save
                    </button>
                </div>
            </div>
            
            <!-- Editor Content -->
            <div class="flex-1 overflow-y-auto p-6">
                <div id="emptyState" class="empty-state flex flex-col items-center justify-center h-full">
                    <svg class="w-24 h-24 text-gray-300 mb-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"></path>
                    </svg>
                    <h2 class="text-xl font-semibold text-gray-400 mb-2">No note selected</h2>
                    <p class="text-gray-400">Create a new note or select one from the list</p>
                </div>
                <textarea 
                    id="noteContent" 
                    placeholder="Start typing your note..." 
                    class="w-full h-full resize-none focus:outline-none text-gray-700 leading-relaxed hidden"
                    disabled
                ></textarea>
            </div>
        </div>
    </div>

    <script>
        let notes = [];
        let currentNote = null;

        // API Functions
        async function fetchNotes() {
            try {
                const response = await fetch('/api/notes');
                notes = await response.json();
                renderNotesList();
            } catch (error) {
                console.error('Error fetching notes:', error);
            }
        }

        async function createNote(title, content) {
            try {
                const response = await fetch('/api/notes', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({ title, content }),
                });
                const newNote = await response.json();
                notes.push(newNote);
                renderNotesList();
                selectNote(newNote.id);
            } catch (error) {
                console.error('Error creating note:', error);
            }
        }

        async function updateNote(id, title, content) {
            try {
                const response = await fetch(`/api/notes/${id}`, {
                    method: 'PUT',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({ title, content }),
                });
                const updatedNote = await response.json();
                const index = notes.findIndex(n => n.id === id);
                if (index !== -1) {
                    notes[index] = updatedNote;
                    renderNotesList();
                }
            } catch (error) {
                console.error('Error updating note:', error);
            }
        }

        async function deleteNote(id) {
            try {
                await fetch(`/api/notes/${id}`, {
                    method: 'DELETE',
                });
                notes = notes.filter(n => n.id !== id);
                renderNotesList();
                clearEditor();
            } catch (error) {
                console.error('Error deleting note:', error);
            }
        }

        // UI Functions
        function renderNotesList(filter = '') {
            const notesList = document.getElementById('notesList');
            const filteredNotes = notes.filter(note => 
                note.title.toLowerCase().includes(filter.toLowerCase()) ||
                note.content.toLowerCase().includes(filter.toLowerCase())
            );

            if (filteredNotes.length === 0) {
                notesList.innerHTML = '<div class="p-4 text-center text-gray-400">No notes found</div>';
                return;
            }

            notesList.innerHTML = filteredNotes.map(note => `
                <div class="note-item p-4 border-b border-gray-200 cursor-pointer ${currentNote && currentNote.id === note.id ? 'active' : ''}" data-id="${note.id}">
                    <h3 class="font-semibold text-gray-800 mb-1 truncate">${note.title || 'Untitled'}</h3>
                    <p class="text-sm text-gray-500 truncate">${note.content || 'No content'}</p>
                    <p class="text-xs text-gray-400 mt-2">${formatDate(note.updated_at)}</p>
                </div>
            `).join('');

            // Add click listeners
            document.querySelectorAll('.note-item').forEach(item => {
                item.addEventListener('click', () => {
                    selectNote(parseInt(item.dataset.id));
                });
            });
        }

        function selectNote(id) {
            currentNote = notes.find(n => n.id === id);
            if (currentNote) {
                document.getElementById('noteTitle').value = currentNote.title;
                document.getElementById('noteContent').value = currentNote.content;
                document.getElementById('noteTitle').disabled = false;
                document.getElementById('noteContent').disabled = false;
                document.getElementById('emptyState').classList.add('hidden');
                document.getElementById('noteContent').classList.remove('hidden');
                document.getElementById('saveBtn').classList.remove('hidden');
                document.getElementById('deleteBtn').classList.remove('hidden');
                renderNotesList();
            }
        }

        function clearEditor() {
            currentNote = null;
            document.getElementById('noteTitle').value = '';
            document.getElementById('noteContent').value = '';
            document.getElementById('noteTitle').disabled = true;
            document.getElementById('noteContent').disabled = true;
            document.getElementById('emptyState').classList.remove('hidden');
            document.getElementById('noteContent').classList.add('hidden');
            document.getElementById('saveBtn').classList.add('hidden');
            document.getElementById('deleteBtn').classList.add('hidden');
            renderNotesList();
        }

        function formatDate(dateString) {
            const date = new Date(dateString);
            const now = new Date();
            const diffMs = now - date;
            const diffMins = Math.floor(diffMs / 60000);
            const diffHours = Math.floor(diffMs / 3600000);
            const diffDays = Math.floor(diffMs / 86400000);

            if (diffMins < 1) return 'Just now';
            if (diffMins < 60) return `${diffMins} min ago`;
            if (diffHours < 24) return `${diffHours} hour${diffHours > 1 ? 's' : ''} ago`;
            if (diffDays < 7) return `${diffDays} day${diffDays > 1 ? 's' : ''} ago`;
            return date.toLocaleDateString();
        }

        // Event Listeners
        document.getElementById('newNoteBtn').addEventListener('click', async () => {
            await createNote('Untitled Note', '');
        });

        document.getElementById('saveBtn').addEventListener('click', async () => {
            if (currentNote) {
                const title = document.getElementById('noteTitle').value;
                const content = document.getElementById('noteContent').value;
                await updateNote(currentNote.id, title, content);
            }
        });

        document.getElementById('deleteBtn').addEventListener('click', async () => {
            if (currentNote && confirm('Are you sure you want to delete this note?')) {
                await deleteNote(currentNote.id);
            }
        });

        document.getElementById('searchInput').addEventListener('input', (e) => {
            renderNotesList(e.target.value);
        });

        // Auto-save on input (debounced)
        let saveTimeout;
        function autoSave() {
            clearTimeout(saveTimeout);
            saveTimeout = setTimeout(async () => {
                if (currentNote) {
                    const title = document.getElementById('noteTitle').value;
                    const content = document.getElementById('noteContent').value;
                    await updateNote(currentNote.id, title, content);
                }
            }, 1000);
        }

        document.getElementById('noteTitle').addEventListener('input', autoSave);
        document.getElementById('noteContent').addEventListener('input', autoSave);

        // Initialize
        fetchNotes();
    </script>
</body>
</html>
