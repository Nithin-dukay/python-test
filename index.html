<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Chat Assistant</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
        }
        
        .chat-container {
            height: calc(100vh - 200px);
            min-height: 400px;
        }
        
        .message {
            animation: fadeIn 0.3s ease-in;
        }
        
        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        
        .typing-indicator {
            display: inline-block;
        }
        
        .typing-indicator span {
            display: inline-block;
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background-color: #6366f1;
            margin: 0 2px;
            animation: typing 1.4s infinite;
        }
        
        .typing-indicator span:nth-child(2) {
            animation-delay: 0.2s;
        }
        
        .typing-indicator span:nth-child(3) {
            animation-delay: 0.4s;
        }
        
        @keyframes typing {
            0%, 60%, 100% {
                transform: translateY(0);
                opacity: 0.7;
            }
            30% {
                transform: translateY(-10px);
                opacity: 1;
            }
        }
        
        .scrollbar-hide::-webkit-scrollbar {
            display: none;
        }
        
        .scrollbar-hide {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
        
        .send-button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
    </style>
</head>
<body class="bg-gradient-to-br from-indigo-50 via-white to-purple-50 min-h-screen">
    <div class="container mx-auto px-4 py-8 max-w-4xl">
        <!-- Header -->
        <div class="text-center mb-8">
            <h1 class="text-4xl font-bold text-gray-800 mb-2">AI Chat Assistant</h1>
            <p class="text-gray-600">Powered by OpenRouter</p>
        </div>
        
        <!-- Chat Container -->
        <div class="bg-white rounded-2xl shadow-xl overflow-hidden">
            <!-- Messages Area -->
            <div id="chatMessages" class="chat-container overflow-y-auto p-6 space-y-4 scrollbar-hide">
                <!-- Welcome Message -->
                <div class="message flex justify-start">
                    <div class="bg-indigo-100 rounded-2xl rounded-tl-sm px-4 py-3 max-w-[80%]">
                        <p class="text-gray-800">👋 Hello! I'm your AI assistant. How can I help you today?</p>
                    </div>
                </div>
            </div>
            
            <!-- Input Area -->
            <div class="border-t border-gray-200 p-4 bg-gray-50">
                <form id="chatForm" class="flex gap-2">
                    <input 
                        type="text" 
                        id="messageInput" 
                        placeholder="Type your message here..." 
                        class="flex-1 px-4 py-3 border border-gray-300 rounded-xl focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-transparent"
                        autocomplete="off"
                    />
                    <button 
                        type="submit" 
                        id="sendButton"
                        class="send-button bg-indigo-600 hover:bg-indigo-700 text-white font-semibold px-6 py-3 rounded-xl transition-colors duration-200 disabled:hover:bg-indigo-600"
                    >
                        Send
                    </button>
                </form>
                <p id="errorMessage" class="text-red-500 text-sm mt-2 hidden"></p>
            </div>
        </div>
        
        <!-- Footer -->
        <div class="text-center mt-6 text-gray-500 text-sm">
            <p>Built with Flask, Gunicorn & OpenRouter</p>
        </div>
    </div>

    <script>
        const chatMessages = document.getElementById('chatMessages');
        const chatForm = document.getElementById('chatForm');
        const messageInput = document.getElementById('messageInput');
        const sendButton = document.getElementById('sendButton');
        const errorMessage = document.getElementById('errorMessage');
        
        let chatHistory = [];
        let isProcessing = false;
        
        // Auto-scroll to bottom
        function scrollToBottom() {
            chatMessages.scrollTop = chatMessages.scrollHeight;
        }
        
        // Show error message
        function showError(message) {
            errorMessage.textContent = message;
            errorMessage.classList.remove('hidden');
            setTimeout(() => {
                errorMessage.classList.add('hidden');
            }, 5000);
        }
        
        // Add user message to chat
        function addUserMessage(message) {
            const messageDiv = document.createElement('div');
            messageDiv.className = 'message flex justify-end';
            messageDiv.innerHTML = `
                <div class="bg-indigo-600 text-white rounded-2xl rounded-tr-sm px-4 py-3 max-w-[80%]">
                    <p>${escapeHtml(message)}</p>
                </div>
            `;
            chatMessages.appendChild(messageDiv);
            scrollToBottom();
            
            // Add to history
            chatHistory.push({
                role: 'user',
                content: message
            });
        }
        
        // Add assistant message to chat
        function addAssistantMessage() {
            const messageDiv = document.createElement('div');
            messageDiv.className = 'message flex justify-start';
            messageDiv.innerHTML = `
                <div class="bg-indigo-100 rounded-2xl rounded-tl-sm px-4 py-3 max-w-[80%]">
                    <p class="text-gray-800" id="assistantMessage"></p>
                </div>
            `;
            chatMessages.appendChild(messageDiv);
            scrollToBottom();
            return messageDiv.querySelector('#assistantMessage');
        }
        
        // Add typing indicator
        function addTypingIndicator() {
            const typingDiv = document.createElement('div');
            typingDiv.id = 'typingIndicator';
            typingDiv.className = 'message flex justify-start';
            typingDiv.innerHTML = `
                <div class="bg-indigo-100 rounded-2xl rounded-tl-sm px-4 py-3">
                    <div class="typing-indicator">
                        <span></span>
                        <span></span>
                        <span></span>
                    </div>
                </div>
            `;
            chatMessages.appendChild(typingDiv);
            scrollToBottom();
        }
        
        // Remove typing indicator
        function removeTypingIndicator() {
            const typingIndicator = document.getElementById('typingIndicator');
            if (typingIndicator) {
                typingIndicator.remove();
            }
        }
        
        // Escape HTML to prevent XSS
        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }
        
        // Handle form submission
        chatForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            
            if (isProcessing) return;
            
            const message = messageInput.value.trim();
            
            if (!message) {
                showError('Please enter a message');
                return;
            }
            
            // Disable input
            isProcessing = true;
            messageInput.disabled = true;
            sendButton.disabled = true;
            messageInput.value = '';
            
            // Add user message
            addUserMessage(message);
            
            // Add typing indicator
            addTypingIndicator();
            
            try {
                // Send request to API
                const response = await fetch('/api/chat', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        message: message,
                        history: chatHistory
                    })
                });
                
                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }
                
                // Remove typing indicator
                removeTypingIndicator();
                
                // Create assistant message element
                const assistantMessageElement = addAssistantMessage();
                let fullResponse = '';
                
                // Read the stream
                const reader = response.body.getReader();
                const decoder = new TextDecoder();
                
                while (true) {
                    const { done, value } = await reader.read();
                    
                    if (done) break;
                    
                    const chunk = decoder.decode(value);
                    const lines = chunk.split('\n');
                    
                    for (const line of lines) {
                        if (line.startsWith('data: ')) {
                            const data = JSON.parse(line.slice(6));
                            
                            if (data.error) {
                                showError(data.error);
                                break;
                            }
                            
                            if (data.content) {
                                fullResponse += data.content;
                                assistantMessageElement.textContent = fullResponse;
                                scrollToBottom();
                            }
                            
                            if (data.done) {
                                // Add to history
                                chatHistory.push({
                                    role: 'assistant',
                                    content: fullResponse
                                });
                            }
                        }
                    }
                }
                
            } catch (error) {
                removeTypingIndicator();
                showError('Failed to send message: ' + error.message);
                console.error('Error:', error);
            } finally {
                // Re-enable input
                isProcessing = false;
                messageInput.disabled = false;
                sendButton.disabled = false;
                messageInput.focus();
            }
        });
        
        // Focus input on load
        messageInput.focus();
    </script>
</body>
</html>
