<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather Report App</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 500px;
        }

        .weather-card {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border-radius: 24px;
            padding: 40px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
        }

        h1 {
            font-size: 32px;
            font-weight: 700;
            color: #1a202c;
            margin-bottom: 30px;
            text-align: center;
        }

        .search-container {
            position: relative;
            margin-bottom: 30px;
        }

        .search-box {
            display: flex;
            gap: 10px;
        }

        input[type="text"] {
            flex: 1;
            padding: 16px 20px;
            font-size: 16px;
            border: 2px solid #e2e8f0;
            border-radius: 12px;
            outline: none;
            transition: all 0.3s ease;
            font-family: inherit;
        }

        input[type="text"]:focus {
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        button {
            padding: 16px 32px;
            font-size: 16px;
            font-weight: 600;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.3s ease;
            font-family: inherit;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(102, 126, 234, 0.3);
        }

        button:active {
            transform: translateY(0);
        }

        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .loading {
            text-align: center;
            padding: 40px;
            color: #667eea;
            font-size: 18px;
            font-weight: 500;
        }

        .loading::after {
            content: '...';
            animation: dots 1.5s steps(4, end) infinite;
        }

        @keyframes dots {
            0%, 20% { content: '.'; }
            40% { content: '..'; }
            60%, 100% { content: '...'; }
        }

        .error {
            background: #fee;
            color: #c33;
            padding: 16px;
            border-radius: 12px;
            margin-bottom: 20px;
            border-left: 4px solid #c33;
        }

        .weather-info {
            display: none;
        }

        .weather-info.show {
            display: block;
            animation: fadeIn 0.5s ease;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .location {
            text-align: center;
            margin-bottom: 30px;
        }

        .city-name {
            font-size: 28px;
            font-weight: 700;
            color: #1a202c;
            margin-bottom: 5px;
        }

        .country {
            font-size: 16px;
            color: #718096;
        }

        .main-weather {
            text-align: center;
            margin-bottom: 30px;
            padding: 20px;
            background: linear-gradient(135deg, rgba(102, 126, 234, 0.1) 0%, rgba(118, 75, 162, 0.1) 100%);
            border-radius: 16px;
        }

        .temperature {
            font-size: 64px;
            font-weight: 700;
            color: #667eea;
            margin-bottom: 10px;
        }

        .condition {
            font-size: 20px;
            color: #4a5568;
            margin-bottom: 10px;
            font-weight: 500;
        }

        .feels-like {
            font-size: 14px;
            color: #718096;
        }

        .unit-toggle {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-top: 15px;
        }

        .unit-btn {
            padding: 8px 16px;
            font-size: 14px;
            background: white;
            color: #667eea;
            border: 2px solid #667eea;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .unit-btn.active {
            background: #667eea;
            color: white;
        }

        .weather-details {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
        }

        .detail-item {
            background: #f7fafc;
            padding: 16px;
            border-radius: 12px;
            text-align: center;
        }

        .detail-label {
            font-size: 12px;
            color: #718096;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 8px;
            font-weight: 600;
        }

        .detail-value {
            font-size: 20px;
            color: #1a202c;
            font-weight: 600;
        }

        @media (max-width: 480px) {
            .weather-card {
                padding: 30px 20px;
            }

            h1 {
                font-size: 24px;
            }

            .search-box {
                flex-direction: column;
            }

            button {
                width: 100%;
            }

            .temperature {
                font-size: 48px;
            }

            .weather-details {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="weather-card">
            <h1>Weather Report</h1>
            
            <div class="search-container">
                <div class="search-box">
                    <input 
                        type="text" 
                        id="cityInput" 
                        placeholder="Enter city name..."
                        autocomplete="off"
                    >
                    <button id="searchBtn">Search</button>
                </div>
            </div>

            <div id="errorMessage" class="error" style="display: none;"></div>
            <div id="loading" class="loading" style="display: none;">Loading weather data</div>

            <div id="weatherInfo" class="weather-info">
                <div class="location">
                    <div class="city-name" id="cityName"></div>
                    <div class="country" id="country"></div>
                </div>

                <div class="main-weather">
                    <div class="temperature" id="temperature"></div>
                    <div class="condition" id="condition"></div>
                    <div class="feels-like" id="feelsLike"></div>
                    <div class="unit-toggle">
                        <button class="unit-btn active" id="celsiusBtn">°C</button>
                        <button class="unit-btn" id="fahrenheitBtn">°F</button>
                    </div>
                </div>

                <div class="weather-details">
                    <div class="detail-item">
                        <div class="detail-label">Humidity</div>
                        <div class="detail-value" id="humidity"></div>
                    </div>
                    <div class="detail-item">
                        <div class="detail-label">Wind Speed</div>
                        <div class="detail-value" id="windSpeed"></div>
                    </div>
                    <div class="detail-item">
                        <div class="detail-label">Pressure</div>
                        <div class="detail-value" id="pressure"></div>
                    </div>
                    <div class="detail-item">
                        <div class="detail-label">Visibility</div>
                        <div class="detail-value" id="visibility"></div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        let weatherData = null;
        let currentUnit = 'celsius';

        const cityInput = document.getElementById('cityInput');
        const searchBtn = document.getElementById('searchBtn');
        const errorMessage = document.getElementById('errorMessage');
        const loading = document.getElementById('loading');
        const weatherInfo = document.getElementById('weatherInfo');
        const celsiusBtn = document.getElementById('celsiusBtn');
        const fahrenheitBtn = document.getElementById('fahrenheitBtn');

        function showError(message) {
            errorMessage.textContent = message;
            errorMessage.style.display = 'block';
            loading.style.display = 'none';
            weatherInfo.classList.remove('show');
        }

        function hideError() {
            errorMessage.style.display = 'none';
        }

        function showLoading() {
            loading.style.display = 'block';
            weatherInfo.classList.remove('show');
            hideError();
        }

        function hideLoading() {
            loading.style.display = 'none';
        }

        function updateWeatherDisplay() {
            if (!weatherData) return;

            const isCelsius = currentUnit === 'celsius';
            
            document.getElementById('cityName').textContent = weatherData.city;
            document.getElementById('country').textContent = 
                weatherData.region ? `${weatherData.region}, ${weatherData.country}` : weatherData.country;
            
            const temp = isCelsius ? weatherData.temperature_c : weatherData.temperature_f;
            const feelsLike = isCelsius ? weatherData.feels_like_c : weatherData.feels_like_f;
            const unit = isCelsius ? '°C' : '°F';
            
            document.getElementById('temperature').textContent = `${temp}${unit}`;
            document.getElementById('condition').textContent = weatherData.condition;
            document.getElementById('feelsLike').textContent = `Feels like ${feelsLike}${unit}`;
            
            document.getElementById('humidity').textContent = `${weatherData.humidity}%`;
            
            const windSpeed = isCelsius ? 
                `${weatherData.wind_speed_kmph} km/h` : 
                `${weatherData.wind_speed_mph} mph`;
            document.getElementById('windSpeed').textContent = windSpeed;
            
            document.getElementById('pressure').textContent = `${weatherData.pressure} mb`;
            document.getElementById('visibility').textContent = `${weatherData.visibility} km`;

            celsiusBtn.classList.toggle('active', isCelsius);
            fahrenheitBtn.classList.toggle('active', !isCelsius);
        }

        async function fetchWeather(city) {
            if (!city.trim()) {
                showError('Please enter a city name');
                return;
            }

            showLoading();
            searchBtn.disabled = true;

            try {
                const response = await fetch(`/api/weather/${encodeURIComponent(city)}`);
                const data = await response.json();

                if (!response.ok) {
                    showError(data.message || 'Failed to fetch weather data');
                    return;
                }

                weatherData = data;
                hideLoading();
                weatherInfo.classList.add('show');
                updateWeatherDisplay();

            } catch (error) {
                showError('Network error. Please check your connection and try again.');
            } finally {
                searchBtn.disabled = false;
            }
        }

        searchBtn.addEventListener('click', () => {
            fetchWeather(cityInput.value);
        });

        cityInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                fetchWeather(cityInput.value);
            }
        });

        celsiusBtn.addEventListener('click', () => {
            currentUnit = 'celsius';
            updateWeatherDisplay();
        });

        fahrenheitBtn.addEventListener('click', () => {
            currentUnit = 'fahrenheit';
            updateWeatherDisplay();
        });

        // Load default city on page load
        window.addEventListener('load', () => {
            cityInput.value = 'London';
            fetchWeather('London');
        });
    </script>
</body>
</html>
