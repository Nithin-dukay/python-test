<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Chat - OpenRouter</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
        }
        .message-content {
            word-wrap: break-word;
            white-space: pre-wrap;
        }
        #chat-messages::-webkit-scrollbar {
            width: 8px;
        }
        #chat-messages::-webkit-scrollbar-track {
            background: #f1f1f1;
            border-radius: 10px;
        }
        #chat-messages::-webkit-scrollbar-thumb {
            background: #888;
            border-radius: 10px;
        }
        #chat-messages::-webkit-scrollbar-thumb:hover {
            background: #555;
        }
        .typing-indicator {
            display: inline-block;
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background-color: #6366f1;
            animation: typing 1.4s infinite;
        }
        .typing-indicator:nth-child(2) {
            animation-delay: 0.2s;
        }
        .typing-indicator:nth-child(3) {
            animation-delay: 0.4s;
        }
        @keyframes typing {
            0%, 60%, 100% {
                transform: translateY(0);
                opacity: 0.7;
            }
            30% {
                transform: translateY(-10px);
                opacity: 1;
            }
        }
    </style>
</head>
<body class="bg-gradient-to-br from-slate-50 to-slate-100 min-h-screen">
    <div class="container mx-auto max-w-5xl h-screen flex flex-col p-4">
        <!-- Header -->
        <div class="bg-white rounded-t-2xl shadow-lg p-6 border-b border-gray-200">
            <div class="flex items-center justify-between">
                <div>
                    <h1 class="text-3xl font-bold text-gray-800">AI Chat</h1>
                    <p class="text-gray-500 text-sm mt-1">Powered by OpenRouter</p>
                </div>
                <div class="flex items-center space-x-4">
                    <label for="model-select" class="text-sm font-medium text-gray-700">Model:</label>
                    <select id="model-select" class="px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500 bg-white text-sm">
                        <option value="meta-llama/llama-3.2-3b-instruct:free">Llama 3.2 3B (Free)</option>
                    </select>
                </div>
            </div>
        </div>

        <!-- Chat Messages -->
        <div id="chat-messages" class="flex-1 bg-white p-6 overflow-y-auto space-y-4">
            <div class="text-center text-gray-400 py-8">
                <p class="text-lg">Start a conversation!</p>
                <p class="text-sm mt-2">Ask me anything...</p>
            </div>
        </div>

        <!-- Input Area -->
        <div class="bg-white rounded-b-2xl shadow-lg p-6 border-t border-gray-200">
            <div class="flex space-x-4">
                <textarea 
                    id="message-input" 
                    rows="1"
                    placeholder="Type your message here..."
                    class="flex-1 px-4 py-3 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500 resize-none"
                    onkeydown="handleKeyPress(event)"
                ></textarea>
                <button 
                    id="send-button"
                    onclick="sendMessage()"
                    class="px-8 py-3 bg-indigo-600 hover:bg-indigo-700 text-white font-semibold rounded-lg transition-colors duration-200 disabled:opacity-50 disabled:cursor-not-allowed"
                >
                    Send
                </button>
            </div>
        </div>
    </div>

    <script>
        let messages = [];
        let isStreaming = false;

        // Load available models
        async function loadModels() {
            try {
                const response = await fetch('/api/models');
                const data = await response.json();
                const select = document.getElementById('model-select');
                select.innerHTML = '';
                data.models.forEach(model => {
                    const option = document.createElement('option');
                    option.value = model.id;
                    option.textContent = model.name;
                    select.appendChild(option);
                });
            } catch (error) {
                console.error('Error loading models:', error);
            }
        }

        function handleKeyPress(event) {
            if (event.key === 'Enter' && !event.shiftKey) {
                event.preventDefault();
                sendMessage();
            }
        }

        function addMessage(role, content, isStreaming = false) {
            const messagesDiv = document.getElementById('chat-messages');
            const messageDiv = document.createElement('div');
            messageDiv.className = `flex ${role === 'user' ? 'justify-end' : 'justify-start'}`;
            
            const bubble = document.createElement('div');
            bubble.className = `max-w-2xl px-6 py-4 rounded-2xl ${
                role === 'user' 
                    ? 'bg-indigo-600 text-white' 
                    : 'bg-gray-100 text-gray-800'
            } shadow-md`;
            
            const contentDiv = document.createElement('div');
            contentDiv.className = 'message-content';
            contentDiv.textContent = content;
            
            if (isStreaming) {
                contentDiv.id = 'streaming-message';
            }
            
            bubble.appendChild(contentDiv);
            messageDiv.appendChild(bubble);
            messagesDiv.appendChild(messageDiv);
            
            messagesDiv.scrollTop = messagesDiv.scrollHeight;
            return contentDiv;
        }

        function showTypingIndicator() {
            const messagesDiv = document.getElementById('chat-messages');
            const indicatorDiv = document.createElement('div');
            indicatorDiv.id = 'typing-indicator';
            indicatorDiv.className = 'flex justify-start';
            indicatorDiv.innerHTML = `
                <div class="bg-gray-100 px-6 py-4 rounded-2xl shadow-md">
                    <div class="flex space-x-2">
                        <span class="typing-indicator"></span>
                        <span class="typing-indicator"></span>
                        <span class="typing-indicator"></span>
                    </div>
                </div>
            `;
            messagesDiv.appendChild(indicatorDiv);
            messagesDiv.scrollTop = messagesDiv.scrollHeight;
        }

        function removeTypingIndicator() {
            const indicator = document.getElementById('typing-indicator');
            if (indicator) {
                indicator.remove();
            }
        }

        async function sendMessage() {
            const input = document.getElementById('message-input');
            const sendButton = document.getElementById('send-button');
            const message = input.value.trim();
            
            if (!message || isStreaming) return;
            
            const model = document.getElementById('model-select').value;
            
            // Clear welcome message if it exists
            const messagesDiv = document.getElementById('chat-messages');
            if (messages.length === 0) {
                messagesDiv.innerHTML = '';
            }
            
            // Add user message
            messages.push({ role: 'user', content: message });
            addMessage('user', message);
            
            // Clear input and disable button
            input.value = '';
            sendButton.disabled = true;
            isStreaming = true;
            
            // Show typing indicator
            showTypingIndicator();
            
            try {
                const response = await fetch('/api/chat', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        messages: messages,
                        model: model,
                        stream: true
                    })
                });
                
                if (!response.ok) {
                    throw new Error('Failed to get response');
                }
                
                // Remove typing indicator
                removeTypingIndicator();
                
                // Create assistant message bubble
                let assistantContent = '';
                const contentDiv = addMessage('assistant', '', true);
                
                // Read streaming response
                const reader = response.body.getReader();
                const decoder = new TextDecoder();
                
                while (true) {
                    const { done, value } = await reader.read();
                    if (done) break;
                    
                    const chunk = decoder.decode(value);
                    const lines = chunk.split('\n');
                    
                    for (const line of lines) {
                        if (line.startsWith('data: ')) {
                            const data = JSON.parse(line.slice(6));
                            
                            if (data.error) {
                                contentDiv.textContent = `Error: ${data.error}`;
                                break;
                            }
                            
                            if (data.content) {
                                assistantContent += data.content;
                                contentDiv.textContent = assistantContent;
                                messagesDiv.scrollTop = messagesDiv.scrollHeight;
                            }
                            
                            if (data.done) {
                                messages.push({ role: 'assistant', content: assistantContent });
                            }
                        }
                    }
                }
                
            } catch (error) {
                removeTypingIndicator();
                addMessage('assistant', `Error: ${error.message}`);
            } finally {
                sendButton.disabled = false;
                isStreaming = false;
                input.focus();
            }
        }

        // Initialize
        loadModels();
    </script>
</body>
</html>
