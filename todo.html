<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Todo List App</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
        }
        .todo-item {
            transition: all 0.3s ease;
        }
        .todo-item:hover {
            transform: translateX(4px);
        }
        .completed {
            opacity: 0.6;
        }
        .completed .todo-title {
            text-decoration: line-through;
        }
    </style>
</head>
<body class="bg-gradient-to-br from-purple-50 via-blue-50 to-indigo-100 min-h-screen py-8 px-4">
    <div class="max-w-3xl mx-auto">
        <!-- Header -->
        <div class="text-center mb-8">
            <h1 class="text-5xl font-bold text-gray-800 mb-2">Todo List</h1>
            <p class="text-gray-600">Organize your tasks efficiently</p>
        </div>

        <!-- Add Todo Form -->
        <div class="bg-white rounded-2xl shadow-xl p-6 mb-6">
            <h2 class="text-xl font-semibold text-gray-800 mb-4">Add New Task</h2>
            <form id="todoForm" class="space-y-4">
                <div>
                    <input 
                        type="text" 
                        id="todoTitle" 
                        placeholder="Task title..." 
                        required
                        class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-transparent"
                    >
                </div>
                <div>
                    <textarea 
                        id="todoDescription" 
                        placeholder="Task description (optional)..." 
                        rows="3"
                        class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-transparent resize-none"
                    ></textarea>
                </div>
                <button 
                    type="submit"
                    class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-semibold py-3 px-6 rounded-lg transition-colors duration-200 transform hover:scale-105"
                >
                    Add Task
                </button>
            </form>
        </div>

        <!-- Filter Buttons -->
        <div class="flex justify-center space-x-2 mb-6">
            <button 
                onclick="filterTodos('all')" 
                id="filterAll"
                class="filter-btn px-6 py-2 rounded-lg font-medium transition-colors duration-200 bg-indigo-600 text-white"
            >
                All
            </button>
            <button 
                onclick="filterTodos('active')" 
                id="filterActive"
                class="filter-btn px-6 py-2 rounded-lg font-medium transition-colors duration-200 bg-gray-200 text-gray-700 hover:bg-gray-300"
            >
                Active
            </button>
            <button 
                onclick="filterTodos('completed')" 
                id="filterCompleted"
                class="filter-btn px-6 py-2 rounded-lg font-medium transition-colors duration-200 bg-gray-200 text-gray-700 hover:bg-gray-300"
            >
                Completed
            </button>
        </div>

        <!-- Todo List -->
        <div class="bg-white rounded-2xl shadow-xl p-6">
            <h2 class="text-xl font-semibold text-gray-800 mb-4">Your Tasks</h2>
            <div id="todoList" class="space-y-3">
                <!-- Todos will be inserted here -->
            </div>
            <div id="emptyState" class="text-center py-12 text-gray-400 hidden">
                <svg class="mx-auto h-16 w-16 mb-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2"></path>
                </svg>
                <p class="text-lg">No tasks yet. Add one to get started!</p>
            </div>
        </div>

        <!-- Stats -->
        <div class="mt-6 text-center text-gray-600">
            <p id="stats">0 tasks</p>
        </div>
    </div>

    <script>
        let todos = [];
        let currentFilter = 'all';

        // Load todos on page load
        document.addEventListener('DOMContentLoaded', () => {
            loadTodos();
        });

        // Add todo form submission
        document.getElementById('todoForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const title = document.getElementById('todoTitle').value.trim();
            const description = document.getElementById('todoDescription').value.trim();
            
            if (!title) return;
            
            try {
                const response = await fetch('/api/todos', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ title, description })
                });
                
                if (response.ok) {
                    document.getElementById('todoTitle').value = '';
                    document.getElementById('todoDescription').value = '';
                    await loadTodos();
                }
            } catch (error) {
                console.error('Error adding todo:', error);
            }
        });

        // Load todos from API
        async function loadTodos() {
            try {
                const response = await fetch('/api/todos');
                todos = await response.json();
                renderTodos();
            } catch (error) {
                console.error('Error loading todos:', error);
            }
        }

        // Render todos based on current filter
        function renderTodos() {
            const todoList = document.getElementById('todoList');
            const emptyState = document.getElementById('emptyState');
            
            let filteredTodos = todos;
            
            if (currentFilter === 'active') {
                filteredTodos = todos.filter(todo => !todo.completed);
            } else if (currentFilter === 'completed') {
                filteredTodos = todos.filter(todo => todo.completed);
            }
            
            if (filteredTodos.length === 0) {
                todoList.innerHTML = '';
                emptyState.classList.remove('hidden');
            } else {
                emptyState.classList.add('hidden');
                todoList.innerHTML = filteredTodos.map(todo => `
                    <div class="todo-item ${todo.completed ? 'completed' : ''} bg-gray-50 rounded-lg p-4 border border-gray-200">
                        <div class="flex items-start space-x-3">
                            <input 
                                type="checkbox" 
                                ${todo.completed ? 'checked' : ''} 
                                onchange="toggleTodo('${todo.id}')"
                                class="mt-1 h-5 w-5 text-indigo-600 rounded focus:ring-indigo-500 cursor-pointer"
                            >
                            <div class="flex-1">
                                <h3 class="todo-title text-lg font-medium text-gray-800">${escapeHtml(todo.title)}</h3>
                                ${todo.description ? `<p class="text-gray-600 text-sm mt-1">${escapeHtml(todo.description)}</p>` : ''}
                            </div>
                            <button 
                                onclick="deleteTodo('${todo.id}')"
                                class="text-red-500 hover:text-red-700 font-medium transition-colors duration-200"
                            >
                                Delete
                            </button>
                        </div>
                    </div>
                `).join('');
            }
            
            updateStats();
        }

        // Toggle todo completion
        async function toggleTodo(id) {
            const todo = todos.find(t => t.id === id);
            if (!todo) return;
            
            try {
                const response = await fetch(`/api/todos/${id}`, {
                    method: 'PUT',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ completed: !todo.completed })
                });
                
                if (response.ok) {
                    await loadTodos();
                }
            } catch (error) {
                console.error('Error toggling todo:', error);
            }
        }

        // Delete todo
        async function deleteTodo(id) {
            if (!confirm('Are you sure you want to delete this task?')) return;
            
            try {
                const response = await fetch(`/api/todos/${id}`, {
                    method: 'DELETE'
                });
                
                if (response.ok) {
                    await loadTodos();
                }
            } catch (error) {
                console.error('Error deleting todo:', error);
            }
        }

        // Filter todos
        function filterTodos(filter) {
            currentFilter = filter;
            
            // Update button styles
            document.querySelectorAll('.filter-btn').forEach(btn => {
                btn.classList.remove('bg-indigo-600', 'text-white');
                btn.classList.add('bg-gray-200', 'text-gray-700');
            });
            
            const activeBtn = document.getElementById(`filter${filter.charAt(0).toUpperCase() + filter.slice(1)}`);
            activeBtn.classList.remove('bg-gray-200', 'text-gray-700');
            activeBtn.classList.add('bg-indigo-600', 'text-white');
            
            renderTodos();
        }

        // Update stats
        function updateStats() {
            const total = todos.length;
            const completed = todos.filter(t => t.completed).length;
            const active = total - completed;
            
            document.getElementById('stats').textContent = 
                `${total} total • ${active} active • ${completed} completed`;
        }

        // Escape HTML to prevent XSS
        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }
    </script>
</body>
</html>
