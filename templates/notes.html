<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Notes App</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
        }
        .note-item:hover {
            background-color: #f3f4f6;
        }
        .note-item.active {
            background-color: #e0e7ff;
            border-left: 4px solid #4f46e5;
        }
        .fade-in {
            animation: fadeIn 0.3s ease-in;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body class="bg-gray-50 h-screen overflow-hidden">
    <div class="flex h-full">
        <!-- Sidebar -->
        <div class="w-80 bg-white border-r border-gray-200 flex flex-col">
            <!-- Header -->
            <div class="p-6 border-b border-gray-200">
                <h1 class="text-2xl font-bold text-gray-800 mb-4">My Notes</h1>
                <button onclick="createNewNote()" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-medium py-2.5 px-4 rounded-lg transition-colors duration-200 flex items-center justify-center">
                    <svg class="w-5 h-5 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"></path>
                    </svg>
                    New Note
                </button>
            </div>

            <!-- Search -->
            <div class="p-4 border-b border-gray-200">
                <div class="relative">
                    <input 
                        type="text" 
                        id="searchInput" 
                        placeholder="Search notes..." 
                        class="w-full pl-10 pr-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-transparent"
                        oninput="filterNotes()"
                    >
                    <svg class="w-5 h-5 text-gray-400 absolute left-3 top-2.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path>
                    </svg>
                </div>
            </div>

            <!-- Notes List -->
            <div id="notesList" class="flex-1 overflow-y-auto">
                <!-- Notes will be dynamically loaded here -->
            </div>
        </div>

        <!-- Main Content -->
        <div class="flex-1 flex flex-col">
            <!-- Editor Header -->
            <div class="bg-white border-b border-gray-200 p-4 flex items-center justify-between">
                <div class="flex items-center space-x-3">
                    <span id="noteStatus" class="text-sm text-gray-500">Select a note or create a new one</span>
                </div>
                <div class="flex items-center space-x-2">
                    <button 
                        id="saveBtn" 
                        onclick="saveCurrentNote()" 
                        class="bg-indigo-600 hover:bg-indigo-700 text-white font-medium py-2 px-4 rounded-lg transition-colors duration-200 disabled:opacity-50 disabled:cursor-not-allowed"
                        disabled
                    >
                        Save
                    </button>
                    <button 
                        id="deleteBtn" 
                        onclick="deleteCurrentNote()" 
                        class="bg-red-600 hover:bg-red-700 text-white font-medium py-2 px-4 rounded-lg transition-colors duration-200 disabled:opacity-50 disabled:cursor-not-allowed"
                        disabled
                    >
                        Delete
                    </button>
                </div>
            </div>

            <!-- Editor -->
            <div id="editorContainer" class="flex-1 overflow-y-auto p-8">
                <div id="emptyState" class="flex flex-col items-center justify-center h-full text-center">
                    <svg class="w-24 h-24 text-gray-300 mb-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"></path>
                    </svg>
                    <h2 class="text-2xl font-semibold text-gray-700 mb-2">No Note Selected</h2>
                    <p class="text-gray-500 mb-6">Create a new note or select one from the sidebar</p>
                    <button onclick="createNewNote()" class="bg-indigo-600 hover:bg-indigo-700 text-white font-medium py-2.5 px-6 rounded-lg transition-colors duration-200">
                        Create Your First Note
                    </button>
                </div>

                <div id="editor" class="hidden max-w-4xl mx-auto">
                    <input 
                        type="text" 
                        id="noteTitle" 
                        placeholder="Note Title" 
                        class="w-full text-3xl font-bold text-gray-800 border-none focus:outline-none mb-4 placeholder-gray-300"
                        oninput="markAsModified()"
                    >
                    <textarea 
                        id="noteContent" 
                        placeholder="Start writing your note..." 
                        class="w-full h-96 text-gray-700 border-none focus:outline-none resize-none placeholder-gray-300"
                        oninput="markAsModified()"
                    ></textarea>
                </div>
            </div>
        </div>
    </div>

    <script>
        let notes = [];
        let currentNoteId = null;
        let isModified = false;

        // Load notes on page load
        document.addEventListener('DOMContentLoaded', () => {
            loadNotes();
        });

        async function loadNotes() {
            try {
                const response = await fetch('/api/notes');
                notes = await response.json();
                renderNotesList();
            } catch (error) {
                console.error('Error loading notes:', error);
            }
        }

        function renderNotesList() {
            const notesList = document.getElementById('notesList');
            const searchTerm = document.getElementById('searchInput').value.toLowerCase();
            
            const filteredNotes = notes.filter(note => 
                note.title.toLowerCase().includes(searchTerm) || 
                note.content.toLowerCase().includes(searchTerm)
            );

            if (filteredNotes.length === 0) {
                notesList.innerHTML = `
                    <div class="p-6 text-center text-gray-500">
                        <p>${searchTerm ? 'No notes found' : 'No notes yet'}</p>
                    </div>
                `;
                return;
            }

            notesList.innerHTML = filteredNotes.map(note => {
                const date = new Date(note.updated_at).toLocaleDateString('en-US', { 
                    month: 'short', 
                    day: 'numeric',
                    year: 'numeric'
                });
                const preview = note.content.substring(0, 60) + (note.content.length > 60 ? '...' : '');
                
                return `
                    <div 
                        class="note-item p-4 border-b border-gray-200 cursor-pointer transition-colors ${currentNoteId === note.id ? 'active' : ''}"
                        onclick="selectNote('${note.id}')"
                    >
                        <h3 class="font-semibold text-gray-800 mb-1 truncate">${note.title || 'Untitled'}</h3>
                        <p class="text-sm text-gray-500 mb-2">${date}</p>
                        <p class="text-sm text-gray-600 line-clamp-2">${preview}</p>
                    </div>
                `;
            }).join('');
        }

        function filterNotes() {
            renderNotesList();
        }

        async function createNewNote() {
            if (isModified && currentNoteId) {
                if (!confirm('You have unsaved changes. Do you want to continue without saving?')) {
                    return;
                }
            }

            try {
                const response = await fetch('/api/notes', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        title: 'Untitled Note',
                        content: ''
                    })
                });

                const newNote = await response.json();
                notes.push(newNote);
                renderNotesList();
                selectNote(newNote.id);
            } catch (error) {
                console.error('Error creating note:', error);
                alert('Failed to create note');
            }
        }

        function selectNote(noteId) {
            if (isModified && currentNoteId && currentNoteId !== noteId) {
                if (!confirm('You have unsaved changes. Do you want to continue without saving?')) {
                    return;
                }
            }

            const note = notes.find(n => n.id === noteId);
            if (!note) return;

            currentNoteId = noteId;
            isModified = false;

            document.getElementById('emptyState').classList.add('hidden');
            document.getElementById('editor').classList.remove('hidden');
            document.getElementById('editor').classList.add('fade-in');

            document.getElementById('noteTitle').value = note.title;
            document.getElementById('noteContent').value = note.content;
            document.getElementById('noteStatus').textContent = 'Editing note';
            
            document.getElementById('saveBtn').disabled = true;
            document.getElementById('deleteBtn').disabled = false;

            renderNotesList();
        }

        function markAsModified() {
            if (currentNoteId) {
                isModified = true;
                document.getElementById('saveBtn').disabled = false;
                document.getElementById('noteStatus').textContent = 'Unsaved changes';
            }
        }

        async function saveCurrentNote() {
            if (!currentNoteId) return;

            const title = document.getElementById('noteTitle').value;
            const content = document.getElementById('noteContent').value;

            try {
                const response = await fetch(`/api/notes/${currentNoteId}`, {
                    method: 'PUT',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ title, content })
                });

                const updatedNote = await response.json();
                
                const index = notes.findIndex(n => n.id === currentNoteId);
                if (index !== -1) {
                    notes[index] = updatedNote;
                }

                isModified = false;
                document.getElementById('saveBtn').disabled = true;
                document.getElementById('noteStatus').textContent = 'Saved';
                
                renderNotesList();

                setTimeout(() => {
                    document.getElementById('noteStatus').textContent = 'Editing note';
                }, 2000);
            } catch (error) {
                console.error('Error saving note:', error);
                alert('Failed to save note');
            }
        }

        async function deleteCurrentNote() {
            if (!currentNoteId) return;

            if (!confirm('Are you sure you want to delete this note?')) {
                return;
            }

            try {
                await fetch(`/api/notes/${currentNoteId}`, {
                    method: 'DELETE'
                });

                notes = notes.filter(n => n.id !== currentNoteId);
                currentNoteId = null;
                isModified = false;

                document.getElementById('emptyState').classList.remove('hidden');
                document.getElementById('editor').classList.add('hidden');
                document.getElementById('noteStatus').textContent = 'Select a note or create a new one';
                document.getElementById('saveBtn').disabled = true;
                document.getElementById('deleteBtn').disabled = true;

                renderNotesList();
            } catch (error) {
                console.error('Error deleting note:', error);
                alert('Failed to delete note');
            }
        }

        // Auto-save on Ctrl+S / Cmd+S
        document.addEventListener('keydown', (e) => {
            if ((e.ctrlKey || e.metaKey) && e.key === 's') {
                e.preventDefault();
                if (currentNoteId && isModified) {
                    saveCurrentNote();
                }
            }
        });
    </script>
</body>
</html>
