<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Notes Application</title>
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
    <div class="container">
        <!-- Header -->
        <header class="header">
            <h1 class="app-title">📝 Notes</h1>
            <div class="header-actions">
                <button id="newNoteBtn" class="btn btn-primary">+ New Note</button>
                <button id="statsBtn" class="btn btn-secondary">Statistics</button>
                <button id="backupBtn" class="btn btn-secondary">Backup</button>
                <button id="exportBtn" class="btn btn-secondary">Export All</button>
            </div>
        </header>

        <!-- Main Content -->
        <div class="main-content">
            <!-- Sidebar -->
            <aside class="sidebar">
                <div class="search-box">
                    <input type="text" id="searchInput" placeholder="Search notes..." class="search-input">
                </div>

                <div class="filters">
                    <div class="filter-section">
                        <h3>Categories</h3>
                        <div id="categoriesList" class="filter-list">
                            <button class="filter-item active" data-category="">All Notes</button>
                        </div>
                    </div>

                    <div class="filter-section">
                        <h3>Tags</h3>
                        <div id="tagsList" class="filter-list">
                            <span class="no-items">No tags yet</span>
                        </div>
                    </div>
                </div>

                <div class="notes-list" id="notesList">
                    <div class="loading">Loading notes...</div>
                </div>
            </aside>

            <!-- Editor -->
            <main class="editor-container">
                <div class="empty-state" id="emptyState">
                    <div class="empty-icon">📝</div>
                    <h2>No Note Selected</h2>
                    <p>Select a note from the list or create a new one to get started.</p>
                    <button class="btn btn-primary" onclick="document.getElementById('newNoteBtn').click()">
                        Create Your First Note
                    </button>
                </div>

                <div class="editor" id="editor" style="display: none;">
                    <div class="editor-header">
                        <input type="text" id="noteTitle" placeholder="Note Title" class="note-title-input">
                        <div class="editor-actions">
                            <button id="saveBtn" class="btn btn-success" disabled>Saved</button>
                            <button id="exportNoteBtn" class="btn btn-secondary">Export</button>
                            <button id="deleteBtn" class="btn btn-danger">Delete</button>
                        </div>
                    </div>

                    <div class="editor-meta">
                        <div class="meta-group">
                            <label>Category:</label>
                            <input type="text" id="noteCategory" placeholder="e.g., Work, Personal" class="meta-input">
                        </div>
                        <div class="meta-group">
                            <label>Tags:</label>
                            <input type="text" id="noteTags" placeholder="Separate tags with commas" class="meta-input">
                        </div>
                    </div>

                    <div class="editor-toolbar">
                        <button class="toolbar-btn" data-action="preview" title="Toggle Preview">👁️ Preview</button>
                        <span class="editor-info" id="editorInfo">Auto-save enabled</span>
                    </div>

                    <div class="editor-content">
                        <textarea id="noteContent" placeholder="Start writing your note..." class="note-textarea"></textarea>
                        <div id="notePreview" class="note-preview" style="display: none;"></div>
                    </div>

                    <div class="editor-footer">
                        <span id="noteTimestamp" class="timestamp"></span>
                        <span id="wordCount" class="word-count">0 words</span>
                    </div>
                </div>
            </main>
        </div>
    </div>

    <!-- Statistics Modal -->
    <div id="statsModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2>Statistics</h2>
                <button class="modal-close" onclick="closeModal('statsModal')">&times;</button>
            </div>
            <div class="modal-body" id="statsContent">
                <div class="loading">Loading statistics...</div>
            </div>
        </div>
    </div>

    <!-- Export Modal -->
    <div id="exportModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2>Export Note</h2>
                <button class="modal-close" onclick="closeModal('exportModal')">&times;</button>
            </div>
            <div class="modal-body">
                <p>Choose export format:</p>
                <div class="export-options">
                    <button class="btn btn-primary" onclick="exportCurrentNote('txt')">Text File (.txt)</button>
                    <button class="btn btn-primary" onclick="exportCurrentNote('md')">Markdown (.md)</button>
                </div>
            </div>
        </div>
    </div>

    <script src="/static/js/app.js"></script>
</body>
</html>
