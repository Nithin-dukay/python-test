<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Notes App</title>
    <link rel="stylesheet" href="notes-style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>📝 My Notes</h1>
            <p class="subtitle">Simple and elegant note-taking</p>
        </header>

        <div class="note-input-section">
            <input
                type="text"
                id="note-title"
                placeholder="Note title..."
                class="note-title-input"
            >
            <textarea
                id="note-content"
                placeholder="Write your note here..."
                class="note-content-input"
                rows="5"
            ></textarea>
            <div class="button-group">
                <button id="add-note-btn" class="btn btn-primary">Add Note</button>
                <button id="cancel-btn" class="btn btn-secondary" style="display: none;">Cancel</button>
            </div>
        </div>

        <div class="search-section">
            <input
                type="text"
                id="search-input"
                placeholder="🔍 Search notes..."
                class="search-input"
            >
        </div>

        <div class="notes-container" id="notes-container">
            <!-- Notes will be dynamically added here -->
        </div>

        <div class="empty-state" id="empty-state">
            <p>No notes yet. Create your first note!</p>
        </div>
    </div>

    <script src="notes-app.js"></script>
</body>
</html>
